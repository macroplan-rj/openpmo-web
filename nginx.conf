server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # API do OpenPMO no mesmo namespace (Service govpb-openpmo-backend, porta 80 -> 8080).
  # O ingress termina o TLS e fala http com este nginx; forçamos https/443 para o
  # Spring montar o redirect_uri OIDC como https (senão vira http://host:443 e o
  # Keycloak rejeita com "Invalid parameter: redirect_uri").
  location /openpmo/ {
    proxy_pass http://govpb-openpmo-backend/openpmo/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 10M;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
