<div class="app-dynamic-selection-lists">
  <div class="header-container" [class.mobile]="responsive">
    <div class="app-content-header" [class.mobile]="responsive">
      <span>{{ 'dynamicSelectionLists' | translate }}</span>
    </div>
  </div>
  <div class="card-container">
    <app-card [properties]="cardProperties" class="mt-0">
      <div class="list-toolbar" *ngIf="!showForm">
        <button type="button" pButton icon="pi pi-plus" iconPos="left" class="p-button-outlined"
          [label]="'dynamicSelectionNewList' | translate" (click)="handleNewList()"></button>
      </div>
      <form class="list-form" *ngIf="showForm" [formGroup]="form" (ngSubmit)="handleSave()">
        <div class="p-grid">
          <span class="p-float-label p-col-12 p-md-6">
            <input id="dsListLabel" type="text" pInputText formControlName="label" maxlength="80">
            <label for="dsListLabel">{{ 'dynamicSelectionListName' | translate }} *</label>
          </span>
          <span class="p-float-label p-col-12 p-md-6">
            <p-dropdown inputId="dsListParent" formControlName="dependsOnKey" [options]="parentOptions" [showClear]="true"
              [autoDisplayFirst]="false" appendTo="body"></p-dropdown>
            <label for="dsListParent">{{ 'dynamicSelectionDependsOn' | translate }}</label>
          </span>
        </div>
        <div class="form-buttons">
          <button type="button" pButton class="p-button-outlined" [label]="'cancel' | translate" (click)="handleCancel()"></button>
          <button type="submit" pButton [label]="'save' | translate" [disabled]="form.invalid || isSaving"></button>
        </div>
      </form>
      <div class="loading-container" *ngIf="isLoading">
        <app-card-loading [isCardLoading]="isLoading"></app-card-loading>
      </div>
      <div class="p-grid" *ngIf="!isLoading">
        <div class="p-col-12 p-sm-12 p-md-4 p-lg-3 card-item-container" *ngFor="let cardItem of cardItems">
          <app-card-item [properties]="cardItem"></app-card-item>
        </div>
        <div class="p-col-12 empty" *ngIf="!cardItems.length">{{ 'noContent' | translate }}</div>
      </div>
    </app-card>
  </div>
</div>
